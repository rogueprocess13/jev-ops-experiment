# Hand-written candidate variant (jev-prompt-variants task 6.2, 2026-11-01), from
# docs/prompt-variants-dev-notes.md. Never edit in place: bump `version` or add a variant.
# v2 (2026-11-01): changed after the task 6.3 review, before any record used v1.
name: evidence-options
version: 2
tier: tier2
style: wording
rationale: 'Wording only. Service and diagnosis options describe what each looks like. Dev notes finding
  3: the baseline names the caller that reports the errors instead of the service that failed, so the
  service options say the failure starts in that service itself. Risk, cuts both ways: in some faults
  the expected origin is the caller that reports the errors or slowness from below (F004, F006), so
  "not when it only reports errors from a service it calls" may lower localization there while raising
  it on F003; read a localization drop on those as this trade-off, not a surprise. v2: dropped "Choose
  this rather than guessing" from `unknown` (a decision bias, so policy, not wording). Questions and
  action wording are the baseline''s.'
dev_records:
- results/tier2/20261012-190447-369b
questions:
  incident_detected:
    instructions: Is there an operational incident in this application right now?
    criteria:
      'true': Yes, something is failing or clearly degraded compared with the baseline.
      'false': No, the application is operating normally.
  affected_service:
    instructions: Which single service or component is the origin of the problem?
    criteria:
      none: No service is failing.
    criteria_templates:
      services: 'The failure starts in {option} itself: {option} is unavailable, or fails or slows down
        on its own work. Not when {option} only reports errors or slowness from a service it calls.'
  diagnosis:
    instructions: What is the most likely failure mode?
    criteria:
      none: Nothing is wrong.
      application_failure: A service returns errors from its own work while the services it calls are
        working.
      latency_degradation: Requests succeed but take much longer than in the baseline window, with few
        or no errors.
      dependency_unreachable: A service's calls to another service or data store fail or time out. The
        caller reports the errors.
      database_contention: A database or data store answers slowly, or with lock or time-out errors.
      resource_exhaustion: A service runs out of CPU, memory or capacity, so it slows down or fails under
        its normal load.
      unknown: The signals are weak, mixed or point to different causes.
  recommended_action:
    instructions: What single operational action should be taken now?
    criteria:
      no_action: Take no action. Keep watching.
      investigate: Look into the cause before changing anything.
      restart_service: Restart the affected service.
      rollback_change: Roll back a recent change or configuration.
      scale_up: Add capacity to the affected service.
      escalate: Hand the incident to a human on-call engineer immediately.

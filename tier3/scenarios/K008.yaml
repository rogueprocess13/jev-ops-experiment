experiment_id: K008
application: otel-demo-3.1.0-kind
description: cart scaled to zero while the load generator triples
rationale: >
  As in the group's harness, cart goes to zero replicas and the load generator to three. The
  load generator is excluded from the observation (it is the harness's own traffic source), so
  what the engine sees is cart unavailable under higher load. The origin is cart; the failure
  mode is that the service is not running. Provisional until task 1.6.
fault:
  type: replica_overload
  target: cart
target_component: cart
duration_s: 240
detection_window_s: 240
poll_interval_s: 15
observation_window_s: 180
baseline_window_s: 180
workload:
  users: 10
expected:
  incident: true
  affected_component: cart
  diagnosis: service_unavailable
  acceptable_actions: [scale_up, rollback_change, investigate, escalate]

experiment_id: K003
application: otel-demo-3.1.0-kind
description: cart memory limit set to 10Mi
rationale: >
  The new cart pod is OOM-killed on start and crash-loops. With one replica and a rolling
  update, the old pod may keep serving, so users may see nothing and the evidence is a stuck
  rollout with OOMKilled restarts (task 1.7 decides). The origin is cart; the failure mode is
  out-of-memory. Undoing the change fixes it.
fault:
  type: memory_limit
  target: cart
target_component: cart
duration_s: 240
detection_window_s: 240
poll_interval_s: 15
observation_window_s: 180
baseline_window_s: 180
workload:
  users: 10
expected:
  incident: true
  affected_component: cart
  diagnosis: oom_killed
  acceptable_actions: [rollback_change, investigate, escalate]

experiment_id: K005
application: otel-demo-3.1.0-kind
description: cart readiness probe always fails
rationale: >
  The new cart pod never becomes Ready, so it receives no traffic. With a rolling update the old
  pod may keep serving (task 1.7 decides), and the evidence is an unready pod, Unhealthy events
  and a stuck rollout. The origin is cart; the failure mode is a failing readiness check.
  Undoing the change fixes it.
fault:
  type: readiness_probe_fail
  target: cart
target_component: cart
duration_s: 240
detection_window_s: 240
poll_interval_s: 15
observation_window_s: 180
baseline_window_s: 180
workload:
  users: 10
expected:
  incident: true
  affected_component: cart
  diagnosis: readiness_failure
  acceptable_actions: [rollback_change, investigate, escalate]

experiment_id: K010
application: otel-demo-3.1.0-kind
description: 500 MB written to /tmp in one cart pod
rationale: >
  As in the group's harness, 500 MB is written to /tmp in a cart pod. On kind the writable layer
  sits on the host disk, so this may cause no symptom at all, and the cart image may have no
  shell to run the write (task 1.9 decides; the scenario may be dropped or set to incident:
  false). If disk pressure shows, the origin is cart and the failure mode is a full disk.
fault:
  type: pvc_full
  target: cart
target_component: cart
duration_s: 240
detection_window_s: 240
poll_interval_s: 15
observation_window_s: 180
baseline_window_s: 180
workload:
  users: 10
expected:
  incident: true
  affected_component: cart
  diagnosis: disk_full
  acceptable_actions: [investigate, escalate]

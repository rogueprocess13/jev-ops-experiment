experiment_id: K004
application: otel-demo-3.1.0-kind
description: all ingress to cart blocked by a NetworkPolicy
rationale: >
  A NetworkPolicy denies all ingress to the cart pods. The pod stays Running and Ready, but
  every call to it times out, so frontend and checkout show errors and latency on calls to cart.
  The origin is cart; the failure mode is blocked network traffic. Removing the policy fixes it.
  Requires a CNI that enforces NetworkPolicy (task 1.3).
fault:
  type: network_partition
  target: cart
target_component: cart
duration_s: 240
detection_window_s: 240
poll_interval_s: 15
observation_window_s: 180
baseline_window_s: 180
workload:
  users: 10
expected:
  incident: true
  affected_component: cart
  diagnosis: network_blocked
  acceptable_actions: [rollback_change, investigate, escalate]
